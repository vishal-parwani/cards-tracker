name: Deploy to Firebase Hosting

# Manual one-tap deploy of the cards-tracker static site.
# Trigger from the GitHub Actions UI (works on mobile/iPad):
#   Actions tab → Deploy to Firebase Hosting → Run workflow → Run workflow
#
# Requires FIREBASE_SERVICE_ACCOUNT secret with roles/firebasehosting.admin
# on the cards-tracker-vishal project. If a 403 fires, grant that role in
# GCP IAM Console and re-trigger.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/sa.json"
          chmod 600 "$HOME/sa.json"

      - name: Deploy to Firebase Hosting
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          firebase deploy --only hosting \
            --project cards-tracker-vishal \
            --non-interactive
